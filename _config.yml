# Jekyll configuration for GitHub Pages
title: Fusion 360 API Interactive Cheat Sheet
description: Interactive Fusion 360 API cheat sheet with hover tooltips and direct links to documentation
url: "https://fusion360-api-cheatsheet.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  data:
    output: true
    permalink: /:collection/:name/

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/ 